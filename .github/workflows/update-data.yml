name: Update TIF data

on:
  schedule:
    # Daily, but the gate job below does real work only on Mondays — or any
    # day while a failure issue is open. www.revenue.wi.gov blackholes GitHub
    # runner IPs for hours at a time (2026-07-05, -09-05, -09-07), so
    # recovery has to come from a later run, not from retrying within one.
    - cron: "0 9 * * *"  # 09:00 UTC; GitHub often starts scheduled runs hours late
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redeploy the site (committed data) even if the refresh finds no change or fails"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write  # dispatching deploy.yml

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — running."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "Monday — running the weekly refresh."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search 'TIF data refresh failed in:title' --json number --jq '.[0].number')" ]; then
            echo "A refresh failure is still open — retrying today."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not Monday and nothing failing — nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Keep the last committed data for the diff guard
        run: cp public/data/districts.json "$RUNNER_TEMP/previous.json"

      # The script only writes its output at the very end, so a failed
      # attempt leaves nothing behind and a retry after a pause is safe.
      # This catches short blips only; a sustained block is left to the
      # next day's run.
      - name: Fetch from DOR (retrying a short block after a pause)
        run: |
          for attempt in 1 2 3; do
            if python fetch_tif_data.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::attempt $attempt failed; waiting 10 minutes before retrying"
              sleep 600
            fi
          done
          exit 1

      - name: Sanity-check the refreshed data
        run: python validate_data.py --previous "$RUNNER_TEMP/previous.json"

      - id: commit
        name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/districts.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN never trigger other workflows (GitHub's
      # recursion guard), so the Pages build must be dispatched explicitly.
      # A forced deploy runs even after a failed fetch: it only rebuilds the
      # data already committed on main.
      - name: Deploy
        if: ${{ !cancelled() && (steps.commit.outputs.changed == 'true' || inputs.deploy == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Close the failure issue after a recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "TIF data refresh failed in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: the refresh succeeded on $(date -u +%Y-%m-%d)."
          done

      - name: Open (or update) the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "TIF data refresh failed in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again $(date -u +%Y-%m-%d): $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "TIF data refresh failed ($(date -u +%Y-%m-%d))" \
              --body "The scheduled data refresh failed — DOR may be unreachable (www.revenue.wi.gov intermittently blocks GitHub runners), may have changed a file shape, or the sanity check rejected the output. Nothing was committed. This run will retry daily and the issue closes itself once a run succeeds. Run: $run_url"
          fi
