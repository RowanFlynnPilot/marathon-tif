name: Update TIF data

on:
  schedule:
    # Weekly, not monthly: www.revenue.wi.gov intermittently blackholes
    # GitHub runner IPs (2026-07-05, 2026-09-05), so a blocked run should
    # cost a week, not a month. Unchanged data commits nothing.
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redeploy the site (committed data) even if the refresh finds no change or fails"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write  # dispatching deploy.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Keep the last committed data for the diff guard
        run: cp public/data/districts.json "$RUNNER_TEMP/previous.json"

      # The script only writes its output at the very end, so a failed
      # attempt leaves nothing behind and a retry after a pause is safe.
      - name: Fetch from DOR (retrying a connection block after a pause)
        run: |
          for attempt in 1 2 3; do
            python fetch_tif_data.py && exit 0
            echo "::warning::attempt $attempt failed; waiting 10 minutes before retrying"
            sleep 600
          done
          exit 1

      - name: Sanity-check the refreshed data
        run: python validate_data.py --previous "$RUNNER_TEMP/previous.json"

      - id: commit
        name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/districts.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN never trigger other workflows (GitHub's
      # recursion guard), so the Pages build must be dispatched explicitly.
      # A forced deploy runs even after a failed fetch: it only rebuilds the
      # data already committed on main.
      - name: Deploy
        if: ${{ !cancelled() && (steps.commit.outputs.changed == 'true' || inputs.deploy == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Close the failure issue after a recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "TIF data refresh failed in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: the refresh succeeded on $(date -u +%Y-%m-%d)."
          done

      - name: Open (or update) the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "TIF data refresh failed in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again $(date -u +%Y-%m-%d): $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "TIF data refresh failed ($(date -u +%Y-%m-%d))" \
              --body "The scheduled data refresh failed — DOR may be unreachable (www.revenue.wi.gov intermittently blocks GitHub runners), may have changed a file shape, or the sanity check rejected the output. Nothing was committed. This issue closes itself when a later run succeeds. Run: $run_url"
          fi
